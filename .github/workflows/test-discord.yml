name: Send test Discord alert

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Which product's alert to show"
        type: choice
        options: [ps5, xbox]
        default: ps5

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION || '@everyone' }}
        run: python monitor.py --demo-alert ${{ inputs.product }}
