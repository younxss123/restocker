name: Probe Nintendo store (temporary)
on:
  push:
    branches: [claude/project-thread-xy87wx]
    paths: [tools/probe_nintendo.py, .github/workflows/probe-nintendo.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/probe_nintendo.py
