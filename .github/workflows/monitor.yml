name: Restock monitor (PS5 Pro + Xbox X25 + Best Buy)

on:
  # Each run watches for ~55 minutes, then starts the next run itself (last step),
  # so checking never stops. The schedule is only a backup to restart the chain if
  # it ever breaks; GitHub runs scheduled jobs late or not at all on new repos.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      run_for:
        description: "Seconds to watch before handing off to the next run"
        default: "3300"

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  actions: write   # lets the last step start the next run
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore last status
        uses: actions/cache/restore@v4
        with:
          path: state.txt
          # v2: "in" now means in stock AND under MAX_PRICE, so old saved statuses don't carry over
          key: stock-state-v2-${{ github.run_id }}
          restore-keys: stock-state-v2-
      - name: Restore last Xbox status
        # Kept in its own cache so the PS5 status above carries over untouched.
        uses: actions/cache/restore@v4
        with:
          path: xbox_state.txt
          key: xbox-state-v1-${{ github.run_id }}
          restore-keys: xbox-state-v1-
      - name: Restore last Best Buy status
        uses: actions/cache/restore@v4
        with:
          path: bestbuy_state.txt
          key: bestbuy-state-v1-${{ github.run_id }}
          restore-keys: bestbuy-state-v1-
      - name: Check every 15s for ~55 minutes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION || '@everyone' }}
          CHECK_INTERVAL: "15"
          XBOX_INTERVAL: "60"
          BESTBUY_INTERVAL: "30"
          MAX_PRICE: ${{ vars.MAX_PRICE || '1000' }}
          RUN_FOR: ${{ inputs.run_for || '3300' }}
          STATE_FILE: state.txt
          XBOX_STATE_FILE: xbox_state.txt
          BESTBUY_STATE_FILE: bestbuy_state.txt
        run: python monitor.py
      - name: Save last status
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: stock-state-v2-${{ github.run_id }}
      - name: Save last Xbox status
        if: always() && hashFiles('xbox_state.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: xbox_state.txt
          key: xbox-state-v1-${{ github.run_id }}
      - name: Save last Best Buy status
        if: always() && hashFiles('bestbuy_state.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: bestbuy_state.txt
          key: bestbuy-state-v1-${{ github.run_id }}
      - name: Start the next run
        # Skipped when you cancel a run by hand, so cancelling stops the chain.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
