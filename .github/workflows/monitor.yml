name: PS5 Pro restock monitor

on:
  schedule:
    # Each run watches for ~55 minutes. A new run queues every 10 minutes so the
    # next one starts as soon as the current one ends (GitHub often starts them late).
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore last status
        uses: actions/cache/restore@v4
        with:
          path: state.txt
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-
      - name: Check every 20s for ~55 minutes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION || '@everyone' }}
          CHECK_INTERVAL: "20"
          RUN_FOR: "3300"
          STATE_FILE: state.txt
        run: python monitor.py
      - name: Save last status
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.txt
          key: stock-state-${{ github.run_id }}
